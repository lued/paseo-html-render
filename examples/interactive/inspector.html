<!doctype html><body lang="en">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { background: transparent; }
  body { margin: 0; background: transparent; color: var(--foreground); }
  .page { width: 100%; min-width: 0; padding: 2px 0 4px; }
  .eyebrow { margin: 0 0 6px; color: var(--muted-foreground); font-size: .72rem; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
  h1 { margin: 0; font-size: clamp(1.2rem, 2.4vw, 1.55rem); line-height: 1.18; letter-spacing: -.01em; }
  .lede { max-width: 62ch; margin: 8px 0 0; color: var(--muted-foreground); font-size: .9rem; line-height: 1.45; }

  .compare { width: 100%; min-width: 0; margin: 16px 0 0; }
  .compare-stage { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; min-width: 0; }
  .compare-layer { position: relative; min-width: 0; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); }
  .compare-layer svg { display: block; width: 100%; height: auto; }
  .compare-after { clip-path: none; }
  .compare-divider { display: none; }
  .compare-handle { display: none; }

  html.js .compare-stage { position: relative; display: block; aspect-ratio: 16 / 9; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); }
  html.js .compare-layer { position: absolute; inset: 0; border: 0; border-radius: 0; }
  html.js .compare-layer svg { width: 100%; height: 100%; }
  html.js .compare-after { clip-path: inset(0 0 0 calc(100% - var(--split, 62%))); }
  html.js .compare-divider { position: absolute; top: 0; bottom: 0; left: calc(100% - var(--split, 62%)); display: block; width: 2px; margin-left: -1px; background: var(--accent); box-shadow: 0 0 0 1px var(--background); pointer-events: none; }
  html.js .compare-handle { position: absolute; top: 50%; left: calc(100% - var(--split, 62%)); display: grid; place-items: center; width: 32px; height: 32px; margin: -16px 0 0 -16px; border: 2px solid var(--accent); border-radius: 50%; background: var(--background); color: var(--accent); font-size: .8rem; font-weight: 700; pointer-events: none; }

  .compare-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 9px 0 0; color: var(--muted-foreground); font-size: .78rem; line-height: 1.4; }
  .compare-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--muted-foreground); }
  .swatch.after { background: var(--accent); }
  .static-note { margin: 8px 0 0; color: var(--muted-foreground); font-size: .78rem; line-height: 1.4; }
  html.js .static-note { display: none; }

  .compare-controls { display: none; align-items: center; gap: 10px; margin-top: 10px; }
  html.js .compare-controls { display: flex; }
  .compare-controls label { flex: 0 0 auto; color: var(--foreground); font-size: .8rem; font-weight: 600; }
  .compare-controls input[type="range"] { width: min(100%, 22rem); min-width: 0; accent-color: var(--accent); }
  .comparison-output { flex: 0 0 auto; min-width: 4.2rem; color: var(--muted-foreground); font-family: var(--font-mono); font-size: .75rem; text-align: right; }

  .art-bg { fill: var(--card); }
  .art-bar { fill: var(--surface2, var(--muted)); }
  .art-panel { fill: var(--muted); stroke: var(--border); stroke-width: 1; }
  .art-faint { fill: var(--muted-foreground); opacity: .28; }
  .art-line { fill: var(--muted-foreground); opacity: .45; }
  .art-accent { fill: var(--accent); }
  .art-accent-soft { fill: var(--accent); opacity: .35; }
  .art-good { fill: var(--success); opacity: .8; }
  .art-text { fill: var(--foreground); font-family: var(--font-sans); font-size: 11px; font-weight: 600; }
  .art-muted { fill: var(--muted-foreground); }

  @media (max-width: 520px) {
    .compare-stage { grid-template-columns: minmax(0, 1fr); }
    .compare-controls { align-items: flex-start; flex-direction: column; gap: 6px; }
    .comparison-output { text-align: left; }
  }
  @media (prefers-reduced-motion: reduce) {
    .compare-layer, .compare-divider { transition: none; }
  }
  html[data-motion="reduce"] .compare-layer, html[data-motion="reduce"] .compare-divider { transition: none; }
</style>

    <figcaption class="compare-legend">
      <span><i class="swatch"></i>Before: dense draft</span>
      <span><i class="swatch after"></i>After: clearer final</span>
    </figcaption>
    <p class="static-note">Both versions are shown side by side. The draggable comparison is an optional enhancement.</p>

    <div class="compare-controls">
      <label for="split">Final layout visible</label>
      <input id="split" type="range" min="0" max="100" step="1" value="62" aria-describedby="split-readout" disabled>
      <output class="comparison-output" id="split-readout" for="split" aria-live="polite">62% after</output>
    </div>
  </figure>
</div>

<script>
(function () {
  var root = document.documentElement;
  var compare = document.getElementById("compare");
  var input = document.getElementById("split");
  var output = document.getElementById("split-readout");
  var mq = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;

  function syncMotion() {
    root.setAttribute("data-motion", mq && mq.matches ? "reduce" : "full");
  }
  syncMotion();
  if (mq && mq.addEventListener) mq.addEventListener("change", syncMotion);

  function apply(value) {
    var split = Math.max(0, Math.min(100, Number(value) || 0));
    compare.style.setProperty("--split", split + "%");
    output.textContent = split + "% after";
    input.setAttribute("aria-valuetext", split + " percent of the final layout visible");
  }

  input.disabled = false;
  input.addEventListener("input", function () {
    apply(input.value);
  });
  apply(input.value);
  root.classList.add("js");
})();
</script>
</body>
